services:
  app:
    build: .
    init: true
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      PGHOST: db
      PGUSER: unishop
      PGDATABASE: unishop
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      UNISHOP_DATA_DIR: /app/data
      APP_URL: ${APP_URL:-http://127.0.0.1:3000}
      PAYMENT_MODE: ${PAYMENT_MODE:-sandbox}


      SMS_DEBUG_MOBILE: ${SMS_DEBUG_MOBILE:-}
      SMS_API_KEY: ${SMS_API_KEY:-}

      SMS_TEMPLATE_ID: ${SMS_TEMPLATE_ID:-259263}
      SMS_CODE_PARAMETER: ${SMS_CODE_PARAMETER:-CODE}
      ZARINPAL_SANDBOX_MERCHANT_ID: ${ZARINPAL_SANDBOX_MERCHANT_ID:-00000000-0000-4000-8000-000000000000}
      ZARINPAL_MERCHANT_ID: ${ZARINPAL_MERCHANT_ID:-}
    volumes:
      - uploads:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: unishop
      POSTGRES_DB: unishop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "unishop", "-d", "unishop"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres:
  uploads:
